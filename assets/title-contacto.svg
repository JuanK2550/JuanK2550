<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="CONTACTO">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF2E88"/><stop offset="0.6" stop-color="#FF5A5F"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#FF2E88"/><stop offset="0.5" stop-color="#6A2C91"/><stop offset="1" stop-color="#6A2C91" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <style>
    .t { font: italic 900 46px 'Arial Black', 'Segoe UI Black', Impact, sans-serif; letter-spacing: 1px; }
